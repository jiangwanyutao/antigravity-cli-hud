      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#13141c"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="10" y="10" width="960" height="260" rx="12" fill="url(#bg)" stroke="#2f334d" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title Bar -->
  <path d="M 10 22 Q 10 10 22 10 L 958 10 Q 970 10 970 22 L 970 44 L 10 44 Z" fill="#1f2335"/>
  <line x1="10" y1="44" x2="970" y2="44" stroke="#2f334d" stroke-width="1"/>
  <circle cx="32" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="27" r="6" fill="#27c93f"/>
  <text x="490" y="32" fill="#7aa2f7" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" text-anchor="middle" font-weight="bold">agy — Google Antigravity CLI (agy-hud)</text>

  <!-- Prompt Input Box -->
  <rect x="28" y="60" width="924" height="44" rx="6" fill="#16161e" stroke="#3b4261" stroke-width="1"/>
